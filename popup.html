<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Transcriber</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 340px;
      padding: 20px;
      background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
      color: #fff;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      color: #333;
    }
    
    h1 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #075e54;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 18px;
    }

    .plan-card {
      padding: 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .plan-card.free {
      background: linear-gradient(135deg, #f0f7ff, #e7f3ff);
      border: 1px solid #b8daff;
    }

    .plan-card.loading {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      text-align: center;
      color: #888;
    }

    .plan-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .plan-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: white;
      background: #007bff;
    }

    .usage-bar {
      height: 8px;
      background: rgba(0,0,0,0.08);
      border-radius: 4px;
      margin: 10px 0 6px;
      overflow: hidden;
    }

    .usage-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }

    .usage-fill.ok { background: #007bff; }
    .usage-fill.warn { background: #ffc107; }
    .usage-fill.full { background: #dc3545; }

    .usage-text {
      font-size: 11px;
      color: #888;
    }

    .how-to {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }

    .how-to strong {
      color: #075e54;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ WhatsApp Transcriber</h1>
    <p class="subtitle">Transcribe voice messages instantly</p>

    <div id="planCard" class="plan-card loading">Loading...</div>

    <div class="how-to">
      <strong>How to use:</strong> Open any WhatsApp chat and click the 
      <strong>📝 Transcribe</strong> button on any voice message.
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
