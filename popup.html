<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Transcriber</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 340px;
      padding: 20px;
      background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
      color: #fff;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      color: #333;
    }
    
    h1 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #075e54;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 18px;
    }

    .plan-card {
      padding: 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .plan-card.free {
      background: linear-gradient(135deg, #f0f7ff, #e7f3ff);
      border: 1px solid #b8daff;
    }

    .plan-card.loading {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      text-align: center;
      color: #888;
    }

    .plan-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .plan-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: white;
      background: #007bff;
    }

    .plan-badge.pro { background: #25d366; }

    .usage-bar {
      height: 8px;
      background: rgba(0,0,0,0.08);
      border-radius: 4px;
      margin: 10px 0 6px;
      overflow: hidden;
    }

    .usage-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }

    .usage-fill.ok { background: #007bff; }
    .usage-fill.warn { background: #ffc107; }
    .usage-fill.full { background: #dc3545; }

    .usage-text {
      font-size: 11px;
      color: #888;
    }

    .how-to {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }

    .how-to strong {
      color: #075e54;
    }

    .pro-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eee;
    }

    .pro-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #075e54;
    }

    .pro-hint {
      font-size: 11px;
      color: #888;
      line-height: 1.5;
      margin-top: 6px;
    }

    .offset-row {
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .offset-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }

    .settings-title {
      font-size: 12px;
      font-weight: 700;
      color: #075e54;
      margin-bottom: 8px;
    }

    .offset-row select {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 10px;
      border: 1px solid #dfe3e6;
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      background: #fff;
    }

    .offset-row input[type="range"] {
      width: 100%;
      accent-color: #25d366;
    }

    .pro-cta {
      display: block;
      margin-top: 10px;
      padding: 9px;
      border-radius: 8px;
      background: #25d366;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .pro-cta:hover { background: #1fb959; }

    .license-entry {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .license-entry input {
      flex: 1;
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid #dfe3e6;
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
    }

    .license-entry button {
      padding: 7px 12px;
      border: 0;
      border-radius: 8px;
      background: #075e54;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .license-entry button:disabled { opacity: 0.6; cursor: default; }

    .license-msg {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.5;
      min-height: 1em;
    }

    .license-msg.ok { color: #128c7e; }
    .license-msg.err { color: #dc3545; }

    .pro-badge-on {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      background: #25d366;
      color: #fff;
      margin-left: 6px;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ WhatsApp Transcriber</h1>
    <p class="subtitle">Transcribe voice messages instantly · <span id="version"></span></p>

    <div id="planCard" class="plan-card loading">Loading...</div>

    <div class="pro-section">
      <div class="pro-row">
        <span id="proStatus">Free plan</span>
      </div>
      <div class="pro-hint" id="proHint">
        Pro adds word-by-word karaoke sync, click-to-seek and 500 transcriptions a day.
      </div>

      <div id="licenseForm">
        <a class="pro-cta" id="getProLink" href="#" target="_blank" rel="noopener">Get Pro</a>
        <div class="license-entry">
          <label class="sr-only" for="licenseInput">License key</label>
          <input type="text" id="licenseInput" placeholder="Already have a key? Paste it">
          <button id="activateBtn" type="button">Activate</button>
        </div>
      </div>

      <div class="license-msg" id="licenseMsg"></div>

      <div class="offset-row hidden" id="offsetRow">
        <div class="settings-title">Karaoke settings</div>
        <div class="offset-label">
          <label for="styleSelect">Highlight style</label>
        </div>
        <select id="styleSelect">
          <option value="sweep">Progressive sweep</option>
          <option value="word">Active word</option>
          <option value="off">No effect</option>
        </select>
        <div class="offset-label">
          <label for="offsetSlider">Sync offset</label>
          <span id="offsetValue">0 ms</span>
        </div>
        <input type="range" id="offsetSlider" min="-500" max="500" step="25" value="0">
      </div>
    </div>

    <div class="how-to">
      <strong>How to use:</strong> Open any WhatsApp chat and click the
      <strong>📝 Transcribe</strong> button on any voice message.
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
