<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Transcriber</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 340px;
      padding: 20px;
      background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
      color: #fff;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      color: #333;
    }
    
    h1 {
      font-size: 16px;
      margin-bottom: 6px;
      color: #075e54;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    h1::before {
      content: "\1F399\FE0F";
    }
    
    .subtitle {
      font-size: 12px;
      color: #667;
      margin-bottom: 16px;
    }

    /* Provider status card */
    .provider-card {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.5;
    }

    .provider-card.cloudflare {
      background: #e7f3ff;
      border: 1px solid #b8daff;
      color: #004085;
    }

    .provider-card.openai {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .provider-card.none {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
    }

    .provider-card .provider-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .provider-card .usage-bar {
      height: 6px;
      background: rgba(0,0,0,0.1);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .provider-card .usage-bar-fill {
      height: 100%;
      background: #007bff;
      border-radius: 3px;
      transition: width 0.3s;
    }

    .provider-card .usage-text {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.8;
    }

    /* Section divider */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 12px;
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-divider::before,
    .section-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }

    .label-hint {
      font-weight: 400;
      color: #999;
      font-size: 11px;
    }
    
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    
    input[type="password"]:focus {
      outline: none;
      border-color: #25d366;
    }
    
    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px 16px;
      background: #25d366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    
    button:hover {
      background: #128c7e;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    
    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .status.info {
      display: block;
      background: #e7f3ff;
      color: #004085;
      border: 1px solid #b8daff;
    }
    
    .help {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #888;
    }
    
    .help a {
      color: #075e54;
      text-decoration: none;
    }
    
    .help a:hover {
      text-decoration: underline;
    }

    #removeKeyBtn {
      background: none;
      color: #dc3545;
      font-size: 11px;
      font-weight: 400;
      margin-top: 6px;
      padding: 4px 0;
      text-decoration: underline;
      cursor: pointer;
    }

    #removeKeyBtn:hover {
      color: #a71d2a;
      background: none;
    }

    /* Diagnostics */
    .diag-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }

    #diagBtn {
      background: #6c757d;
      font-size: 12px;
    }

    #diagBtn:hover {
      background: #5a6268;
    }

    #diagBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #diagBtn.success {
      background: #28a745;
    }

    #diagBtn.error {
      background: #dc3545;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WhatsApp Transcriber</h1>
    <p class="subtitle">Voice message transcription</p>

    <!-- Provider status -->
    <div id="providerCard" class="provider-card none" style="display:none;"></div>

    <div class="section-divider">OpenAI API Key</div>

    <label for="apiKey">
      API Key <span class="label-hint">(optional — for unlimited use)</span>
    </label>
    <input 
      type="password" 
      id="apiKey" 
      placeholder="sk-..." 
      autocomplete="off"
    >
    
    <button id="saveBtn">Save API Key</button>
    <button id="removeKeyBtn" style="display:none;">Remove API key (use free tier)</button>
    
    <div id="status" class="status"></div>
    
    <div class="help">
      <p>Don't have an API Key? 
        <a href="https://platform.openai.com/api-keys" target="_blank">
          Get one here &rarr;
        </a>
      </p>
      <p style="margin-top: 6px;">Without a key, you get 20 free transcriptions/day.</p>
    </div>

    <div class="diag-section">
      <button id="diagBtn">Run Diagnostics &amp; Copy to Clipboard</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
